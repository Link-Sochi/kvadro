<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --green:#1d6b2e;--green2:#2d8a3e;--orange:#d85c0a;--orange2:#e87320;
  --teal:#0e7a60;--cream:#faf8f2;--stone:#252018;--gray:#58504a;
  --light:#9a9288;--gold:#b89040;--border:#ddd6c8;
}
html,body{height:100%;font-family:'Segoe UI',Arial,sans-serif;background:var(--cream)}

/* ── HEADER ── */
.header{
  background:linear-gradient(135deg,#0e2a14 0%,var(--green) 55%,#2d8a3e 100%);
  padding:16px 20px 14px;color:#fff;
  display:flex;align-items:center;justify-content:space-between;
  gap:12px;flex-wrap:wrap;
}
.header-left h1{font-size:18px;font-weight:700;letter-spacing:-.02em;line-height:1.2}
.header-left p{font-size:11px;color:rgba(255,255,255,.65);margin-top:3px}
.stats-row{display:flex;gap:6px;flex-wrap:wrap}
.stat{
  background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.2);
  border-radius:8px;padding:6px 12px;text-align:center;min-width:70px;
}
.stat-val{font-size:16px;font-weight:700;line-height:1;color:#fff}
.stat-lbl{font-size:9px;color:rgba(255,255,255,.6);margin-top:2px;text-transform:uppercase;letter-spacing:.05em}
.stat.gold .stat-val{color:#f0c060}

/* ── MAP ── */
#map{width:100%;height:calc(100vh - 230px);min-height:340px;z-index:1}

/* ── ELEVATION PANEL ── */
.ele-panel{
  background:#fff;border-top:2px solid var(--border);
  padding:12px 16px 10px;
}
.ele-title{
  font-size:11px;font-weight:600;color:var(--light);
  text-transform:uppercase;letter-spacing:.07em;margin-bottom:8px;
  display:flex;align-items:center;gap:8px;
}
.ele-title span{color:var(--stone)}
#eleCanvas{width:100%;height:70px;display:block;cursor:crosshair}
.ele-meta{
  display:flex;justify-content:space-between;margin-top:6px;
  font-size:10px;color:var(--light);
}
.ele-meta b{color:var(--stone)}

/* ── BOTTOM INFO ── */
.bottom{
  background:var(--stone);padding:10px 16px;
  display:flex;align-items:center;justify-content:space-between;
  flex-wrap:wrap;gap:8px;
}
.bottom-left{font-size:11px;color:rgba(255,255,255,.7)}
.bottom-left strong{color:#fff;font-size:13px}
.btn-call{
  background:var(--orange);color:#fff;border:none;border-radius:8px;
  padding:8px 18px;font-size:12px;font-weight:600;cursor:pointer;
  text-decoration:none;font-family:inherit;
}
.btn-wa{background:#25D366}

/* ── CUSTOM MARKERS ── */
.marker-base{
  width:36px;height:36px;border-radius:50%;
  background:var(--orange);border:3px solid #fff;
  display:flex;align-items:center;justify-content:center;
  font-size:14px;font-weight:700;color:#fff;
  box-shadow:0 2px 10px rgba(0,0,0,.3);
}
.marker-peak{background:var(--green)}
.marker-cross{
  width:10px;height:10px;background:rgba(216,92,10,.7);
  border-radius:50%;border:2px solid rgba(216,92,10,.4);
}


  /* animated dashes */
  @keyframes dashMove { to { stroke-dashoffset: -40; } }
  @keyframes dashMoveRet { to { stroke-dashoffset: -30; } }
  .route-anim path { animation: dashMove 1.4s linear infinite; }
  .route-ret  path { animation: dashMoveRet 1.8s linear infinite; }

/* ── POPUP ── */
.leaflet-popup-content-wrapper{border-radius:10px;box-shadow:0 4px 20px rgba(0,0,0,.15)}
.leaflet-popup-content{margin:12px 14px;font-family:'Segoe UI',Arial,sans-serif}
.pop-title{font-size:13px;font-weight:700;color:var(--stone);margin-bottom:4px}
.pop-sub{font-size:11px;color:var(--gray);line-height:1.5}
.pop-badge{
  display:inline-block;background:var(--orange);color:#fff;
  border-radius:4px;padding:2px 8px;font-size:10px;font-weight:600;margin-top:6px;
}
.pop-badge.green{background:var(--green)}
.pop-badge.teal{background:var(--teal)}
</style>

function photoIcon(imgSrc, borderColor='#d85c0a', label='', size=48) {
  return L.divIcon({
    html: `<div style="
      width:${size}px;height:${size}px;border-radius:50%;
      border:3px solid ${borderColor};
      background:url(${imgSrc}) center/cover no-repeat;
      box-shadow:0 3px 14px rgba(0,0,0,.4);
      position:relative;
    ">
      ${label ? `<div style="position:absolute;bottom:-18px;left:50%;transform:translateX(-50%);
        background:${borderColor};color:#fff;font-size:9px;font-weight:700;
        padding:2px 6px;border-radius:10px;white-space:nowrap;font-family:Arial">
        ${label}</div>` : ''}
    </div>`,
    className: '',
    iconSize: [size, size + (label ? 22 : 0)],
    iconAnchor: [size/2, size/2]
  });
}

map.fitBounds(L.polyline(COORDS).getBounds(), { padding: [24,24] });

// ── Track hover marker ───────────────────────────────────
const hoverMarker = L.circleMarker([43.65249,39.73343], {
  radius:7, color:'#d85c0a', fillColor:'#fff', fillOpacity:1, weight:2.5,
  interactive: false
}).addTo(map);
hoverMarker.setStyle({ opacity:0, fillOpacity:0 });

// ── Elevation canvas ─────────────────────────────────────
const cvs = document.getElementById('eleCanvas');
function drawProfile(hoverIdx) {
  const W = cvs.clientWidth, H = cvs.clientHeight;
  cvs.width = W * window.devicePixelRatio;
  cvs.height = H * window.devicePixelRatio;
  const ctx = cvs.getContext('2d');
  ctx.scale(window.devicePixelRatio, window.devicePixelRatio);

  const minE = Math.min(...PROF_E) - 10;
  const maxE = Math.max(...PROF_E) + 10;
  const n = PROF_E.length;
  const pad = { l:4, r:4, t:4, b:2 };
  const gw = W - pad.l - pad.r, gh = H - pad.t - pad.b;

  const xOf = i => pad.l + (i/(n-1))*gw;
  const yOf = e => pad.t + gh - ((e-minE)/(maxE-minE))*gh;

  // gradient fill
  const grad = ctx.createLinearGradient(0, pad.t, 0, pad.t+gh);
  grad.addColorStop(0, 'rgba(29,107,46,.55)');
  grad.addColorStop(1, 'rgba(29,107,46,.04)');

  ctx.beginPath();
  ctx.moveTo(xOf(0), yOf(PROF_E[0]));
  for(let i=1;i<n;i++) ctx.lineTo(xOf(i), yOf(PROF_E[i]));
  ctx.lineTo(xOf(n-1), pad.t+gh);
  ctx.lineTo(xOf(0), pad.t+gh);
  ctx.closePath();
  ctx.fillStyle = grad; ctx.fill();

  // line
  ctx.beginPath();
  ctx.moveTo(xOf(0), yOf(PROF_E[0]));
  for(let i=1;i<n;i++) ctx.lineTo(xOf(i), yOf(PROF_E[i]));
  ctx.strokeStyle='#1d6b2e'; ctx.lineWidth=1.8; ctx.lineJoin='round'; ctx.stroke();

  // hover
  if(hoverIdx !== undefined && hoverIdx >= 0 && hoverIdx < n) {
    const hx = xOf(hoverIdx), hy = yOf(PROF_E[hoverIdx]);
    ctx.beginPath(); ctx.moveTo(hx, pad.t); ctx.lineTo(hx, pad.t+gh);
    ctx.strokeStyle='rgba(216,92,10,.5)'; ctx.lineWidth=1.2; ctx.stroke();
    ctx.beginPath(); ctx.arc(hx,hy,4,0,Math.PI*2);
    ctx.fillStyle='#d85c0a'; ctx.fill();
    ctx.strokeStyle='#fff'; ctx.lineWidth=1.5; ctx.stroke();
    document.getElementById('ele-hover').textContent =
      `${PROF_D[hoverIdx].toFixed(2)} км · ${PROF_E[hoverIdx]} м`;
  }

  // mid divider
  const midX = xOf(Math.floor(n*0.45));
  ctx.beginPath(); ctx.moveTo(midX, pad.t); ctx.lineTo(midX, pad.t+gh);
  ctx.setLineDash([3,3]); ctx.strokeStyle='rgba(216,92,10,.3)'; ctx.lineWidth=1; ctx.stroke();
  ctx.setLineDash([]);
}

drawProfile();
window.addEventListener('resize', () => drawProfile());

cvs.addEventListener('mousemove', e => {
  const rect = cvs.getBoundingClientRect();
  const x = e.clientX - rect.left;
  const idx = Math.round((x / rect.width) * (PROF_E.length-1));
  drawProfile(idx);
  // move map marker
  if(idx >= 0 && idx < COORDS.length) {
    const ci = Math.round((idx/(PROF_E.length-1))*(COORDS.length-1));
    hoverMarker.setLatLng(COORDS[ci]);
    hoverMarker.setStyle({ opacity:1, fillOpacity:1 });
  }
});
cvs.addEventListener('mouseleave', () => {
  drawProfile();
  hoverMarker.setStyle({ opacity:0, fillOpacity:0 });
  document.getElementById('ele-hover').textContent = 'наведите курсор';
});
